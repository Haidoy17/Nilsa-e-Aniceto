:root{--bg:#d3c9ae;--flap:#ddd4bb;--ink:#3f4a2a;--olive:#6a7236;--olive-d:#4b5230;--gold:#a8916a;--muted:#6c6a4f;color-scheme:only light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;display:flex;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-left,0px)) 24px max(20px,env(safe-area-inset-right,0px));min-height:100vh;min-height:100svh;overflow-x:hidden}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,#e0d8c1,#d9d0b6 55%,#d4caae);clip-path:polygon(0 0,100% 0,100% 38%,50% 62%,0 38%);filter:drop-shadow(0 6px 7px rgba(70,58,28,.22));z-index:-1}
.card{width:100%;max-width:360px;text-align:center}
.lbl{font-family:'Montserrat',Arial,sans-serif;font-size:.6rem;letter-spacing:.36em;text-transform:uppercase;color:var(--muted)}
.names{font-family:'Lamoric Rowen','Bodoni Moda',Georgia,serif;font-size:2.8rem;font-size:clamp(2.4rem,12vw,3.2rem);line-height:1.02;margin:16px 0 0;color:var(--ink)}
.names span{display:block;font-size:.62em;color:#7f8a55;margin:.08em 0}
.rule{width:46px;height:1px;background:var(--gold);margin:20px auto 18px}
form{margin-top:34px;display:grid;gap:12px}
label{font-family:'Montserrat',Arial,sans-serif;font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
input{width:100%;text-align:center;font-family:'Montserrat',Arial,sans-serif;font-size:1.15rem;letter-spacing:.3em;text-transform:uppercase;padding:14px;border:1px solid #bfb393;border-radius:10px;background:rgba(255,253,246,.85);color:var(--ink);outline:0}
input:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(106,114,54,.15)}
button{font-family:'Montserrat',Arial,sans-serif;font-weight:500;font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:#fff;background:var(--olive);border:0;border-radius:10px;padding:15px;cursor:pointer;box-shadow:0 8px 18px -10px rgba(52,58,31,.8)}
button:hover{background:var(--olive-d)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.err{min-height:1.4em;font-style:italic;color:#8a3b2b;font-size:1rem}
.note{margin-top:22px;font-style:italic;color:var(--muted);font-size:1.02rem;line-height:1.45}
</style>
</head>
<body>
<main class="card">
  <div class="lbl">Um convite especial para si</div>
  <div class="names">Nilsa<span>&amp;</span>Aniceto</div>
  <div class="rule"></div>
  <div class="lbl">O nosso casamento</div>
  <form id="f" autocomplete="off">
    <label for="code">Código do convite</label>
    <input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="••••••" required>
    <button type="submit" id="go">Abrir convite</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="note">Este convite é reservado aos convidados.<br>O código está na mensagem que recebeu.</p>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const KEY='na-convite-codigo';
async function tryCode(code,quiet){
  try{const html=await unlock(code);try{localStorage.setItem(KEY,code.trim().toUpperCase())}catch(e){};show(html);return true}
  catch(e){if(!quiet){document.getElementById('err').textContent='Código incorrecto. Confira a mensagem que recebeu.'}return false}
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const b=document.getElementById('go');b.disabled=true;b.textContent='A abrir…';
  document.getElementById('err').textContent='';
  const ok=await tryCode(document.getElementById('code').value,false);
  if(!ok){b.disabled=false;b.textContent='Abrir convite';document.getElementById('code').select()}
});
if(!(window.crypto&&crypto.subtle)){document.getElementById('err').textContent='Abra este link num navegador actualizado (Chrome ou Safari).'}
else{let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){};if(saved)tryCode(saved,true);}
</script>
